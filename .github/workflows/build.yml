name: Build & Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK & Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure local.properties with optional Yandex MapKit API key
        env:
          YANDEX_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
        run: |
          mkdir -p android
          touch android/local.properties
          if [ -n "$YANDEX_KEY" ]; then
            echo "YANDEX_MAPKIT_API_KEY=$YANDEX_KEY" >> android/local.properties
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

      - name: Build debug APK
        env:
          YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
        run: flutter build apk --debug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: marshrutka-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
